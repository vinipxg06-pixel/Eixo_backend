spring.application.name=eixo
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8082}

# CORS: endereços do frontend autorizados a chamar a API (separados por vírgula)
eixo.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eixo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# Bancos criados antes do Flyway (sem a tabela flyway_schema_history) são marcados como versão 1:
# a V1 (estrutura) é pulada e as migrations seguintes são aplicadas normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1